[tool.poetry]
version = "0.1.0"
requires-poetry = ">=2.0.0,<3.0.0"

[tool.poetry.dependencies]
python = "^3.13"

[build-system]
requires = ["poetry-core (>=2.0.0,<3.0.0)"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tmautils"
description = "Internet Measurement Research Utilities"
dynamic = ["version"]
readme = "README.md"
license = "MPL-2.0"
authors = [
    {name = "Sulyab Thottungal Valapu", email = "sulyabtv@gmail.com"},
    {name = "Yejin Cho", email = "i3pivigui@icloud.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "dnspython (>=2.8.0,<3.0.0)",
    "pyasn (>=1.6.2,<2.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "tranco (>=0.8.1,<0.9.0)",
    "dataclasses-json (>=0.6.7,<0.7.0)",
    "tldextract (>=5.3.0,<6.0.0)",
    "aiohttp (>=3.13.0,<4.0.0)",
    "pytricia (>=1.2.0,<2.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "cryptography (>=46.0.0,<47.0.0)",
    "websocket-client (>=1.9.0,<2.0.0)",
    "certifi (>=2025.11.12,<2026.0.0)",
    "duckdb (>=1.4.1,<2.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "aiolimiter (>=1.1.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: marks tests as requiring network access (deselect with '-m \"not network\"')",
]
