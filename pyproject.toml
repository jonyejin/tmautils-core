[tool.poetry]
version = "0.2.0"
requires-poetry = ">=2.0.0,<3.0.0"
packages = [
    {include = "tmautils", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.13"

[build-system]
requires = ["poetry-core (>=2.0.0,<3.0.0)"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tmautils-core"
description = "Core infrastructure for tmautils"
dynamic = ["version"]
readme = "README.md"
license = "MPL-2.0"
authors = [
    {name = "Sulyab Thottungal Valapu", email = "sulyabtv@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "pyarrow (>=22.0.0,<23.0.0)",
    "aiohttp (>=3.13.0,<4.0.0)",
    "pytricia (>=1.2.0,<2.0.0)",
    "msgpack (>=1.0.0,<2.0.0)",
    "duckdb (>=1.4.1,<2.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "tenacity (>=9.1.2,<10.0.0)",
    "aiolimiter (>=1.1.0,<2.0.0)",
]

[project.urls]
Repository = "https://github.com/sulyabtv/tmautils-core"

[project.optional-dependencies]
dev = [
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    # duckdb internally requires numpy and pandas for some features.
    # We add them here for test coverage.
    "numpy (>=2.0.0,<3.0.0)",
    "pandas (>=2.3.0,<3.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: marks tests as requiring network access (deselect with '-m \"not network\"')",
]
